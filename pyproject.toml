[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proctor-ai"
version = "0.2.0"
authors = [
  {name = "Svngoku", email = "svngokuofficiel@gmail.com"},
]
description = "A comprehensive Python package for structured prompt engineering techniques"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
keywords = ["prompt-engineering", "llm", "ai", "nlp", "gpt", "openai", "prompt-templates"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
dependencies = [
    "openrouter>=0.10.2",
    "openai>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "aiohttp>=3.9.0",
    "dspy>=2.6.27",
]

[project.optional-dependencies]
knn = [
    "sentence-transformers>=2.0.0",
    "scikit-learn>=1.0.0"
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "build>=1.2.0",
    "twine>=5.0.0"
]
all = [
    "sentence-transformers>=2.0.0",
    "scikit-learn>=1.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "build>=1.2.0",
    "twine>=5.0.0"
]

[project.urls]
"Homepage" = "https://github.com/svngoku/proctor"
"Bug Tracker" = "https://github.com/svngoku/proctor/issues"
"Documentation" = "https://github.com/svngoku/proctor/blob/master/README.md"
"Source Code" = "https://github.com/svngoku/proctor" 

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
